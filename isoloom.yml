# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# vulnerable-AD (by WazeHell, now safebuffer): one Windows Server 2019 domain controller for
# cs.org, filled by upstream's PowerShell script with random users and the misconfigurations
# behind the classic AD attacks (ACL abuse, Kerberoasting, AS-REP roasting, DCSync rights,
# passwords in descriptions, DnsAdmins). Source: https://github.com/safebuffer/vulnerable-AD,
# vendored in vulnerable-AD/. Built by provision/main.yml from a controller Isoloom adds.
# VM targets only. `isoloom run vagrant`, then `isoloom test vagrant`.
version: 1
name: vulnerable-ad

networks:
  lab: { cidr: 10.60.81.0/24 }

machines:
  dc01:
    networks: { lab: 10 }
    services:
      - { port: 53, name: dns }
      - { port: 88, name: kerberos }
      - { port: 135, name: rpc }
      - { port: 389, name: ldap }
      - { port: 445, name: smb }
      - { port: 5985, name: winrm }
    resources: { cpus: 2, memory_mb: 3072 }
    vm:
      os: windows-server-2019

provision:
  - ansible: provision/main.yml
    requirements: provision/requirements.yml
    groups:
      dc: [dc01]

checks:
  - { name: dns answers, tcp: "dc01:53", wait: 300 }
  - { name: kerberos answers, tcp: "dc01:88" }
  - { name: ldap answers, tcp: "dc01:389" }
  - { name: smb answers, tcp: "dc01:445" }
  - checks/vulnerable-ad-objects.sh

message: |
  vulnerable-AD is up: dc01, the domain controller of cs.org, at {{ machines.dc01.addresses.lab }}.
  Users, groups and ACLs are random on every build. Start from an anonymous view of the domain,
  then spray, roast and follow the ACLs to Domain Admin.
